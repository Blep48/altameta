name: Verify build
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      # Vite/TanStack generates routeTree.gen.ts during build; typecheck the generated route graph afterwards.
      - run: npm run build
      - run: npm run typecheck
